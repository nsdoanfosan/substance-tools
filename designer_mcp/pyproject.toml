[project]
name = "substance-designer-mcp"
version = "0.1.0"
description = "Local MCP bridge for Adobe Substance 3D Designer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
substance-designer-mcp = "substance_designer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/substance_designer_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
